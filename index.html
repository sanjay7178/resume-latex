<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF.js Viewer (CDN Version)</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }
        #pdf-viewer {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <!-- 
        This version uses the PDF.js viewer hosted on Mozilla's CDN.
        Replace 'https://example.com/main.pdf' with the actual URL of your PDF.
        If your PDF is local, you'll need to serve it from a web server.
    -->
    <iframe 
        id="pdf-viewer"
        src="https://mozilla.github.io/pdf.js/web/viewer.html?file=https://sanjay7178.github.io/resume-latex/main.pdf#sidebar=on&toolbar=on"
        title="PDF Viewer">
    </iframe>
</body>
</html>
